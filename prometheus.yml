global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    project: ai-devops-causality-engine
    environment: development

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    honor_labels: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
          component: monitoring

  - job_name: ai-devops-api
    honor_labels: true
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: ai-devops-causality-api
          component: application

  - job_name: redis
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis:9121
        labels:
          service: redis
          component: cache
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: loki
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki
          component: logging

  - job_name: otel-collector
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
        labels:
          service: otel-collector
          component: telemetry

  - job_name: grafana
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana
          component: visualization