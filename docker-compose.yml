name: ai-devops-causality-platform

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ai-devops-causality-engine:local
    container_name: ai-devops-api
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
      ARTIFACT_DIR: /app/artifacts
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ai-devops-causality-api
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - app-artifacts:/app/artifacts
    depends_on:
      prometheus:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network
      - observability-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-1.5}
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-devops-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.enable-lifecycle
      - --web.external-url=http://localhost:${PROMETHEUS_PORT:-9090}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -q -O - http://127.0.0.1:9090/-/healthy >/dev/null 2>&1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - observability-network
    security_opt:
      - no-new-privileges:true
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.75}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: ai-devops-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEMORY_LIMIT:-192m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  loki:
    image: grafana/loki:3.2.1
    container_name: ai-devops-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -q -O - http://127.0.0.1:3100/ready >/dev/null 2>&1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability-network
    security_opt:
      - no-new-privileges:true
    mem_limit: ${LOKI_MEMORY_LIMIT:-512m}
    cpus: ${LOKI_CPU_LIMIT:-0.75}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ai-devops-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - observability-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: ai-devops-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - app-network
      - observability-network
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OTEL_MEMORY_LIMIT:-256m}
    cpus: ${OTEL_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    name: ai-devops-app-network
    driver: bridge
    internal: true
  observability-network:
    name: ai-devops-observability-network
    driver: bridge

volumes:
  app-data:
    name: ai-devops-app-data
  app-logs:
    name: ai-devops-app-logs
  app-artifacts:
    name: ai-devops-app-artifacts
  prometheus-data:
    name: ai-devops-prometheus-data
  redis-data:
    name: ai-devops-redis-data
  loki-data:
    name: ai-devops-loki-data
  grafana-data:
    name: ai-devops-grafana-data
